[project]
name = "dataops"
version = "0.9.0"
description = "DPH DMAG Data Operations"
readme = "README.md"
authors = [
    { name = "Alexander Senetcky", email = "alexander.senetcky@ct.gov" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "lxml>=6.0.4",
    "pandas>=3.0.2",
    "pathlib>=1.0.1",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "sodapy>=2.2.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
